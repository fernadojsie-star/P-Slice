on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      os:
        required: true
        type: string
      buildArgs:
        required: true
        type: string
      artifactName:
        required: true
        type: string
      artifactPath:
        required: true
        type: string
      cachePath:
        required: true
        type: string
      cacheLibrariesPath:
        required: true
        type: string
      exportPath:
        required: true
        type: string

env:
  HAXE_VERSION: 4.3.6
  PROJECT_NAME: PSliceEngine

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Set XCode app
        if: inputs.os == 'macos-15'
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Restore Libraries for compilation
        id: load-lib-cache
        uses: actions/cache@v3
        with:
          key: ${{ inputs.cacheLibrariesPath }}
          fail-on-cache-miss: true
          enableCrossOsArchive: true
          path: |
            .haxelib/

      - name: Restore existing build cache for faster compilation
        id: load-cache
        uses: actions/cache@v3
        with:
          key: ${{ inputs.cachePath }}
          path: |
            export/release/${{ inputs.exportPath }}/haxe/
            export/release/${{ inputs.exportPath }}/obj/
          restore-keys: |
            cache-build-${{ inputs.exportPath }}

      - name: Install libVLC
        if: inputs.exportPath == 'linux'
        run: sudo apt install libvlc-dev libvlccore-dev

      - name: Configure Android
        if: inputs.exportPath == 'android'
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_X64
          haxelib run lime config ANDROID_SETUP true

      - name: Remove Firebase from Lime Android template
        if: inputs.exportPath == 'android'
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          root = Path(".haxelib/lime/git/templates/android/template")

          if not root.exists():
              raise SystemExit("ERROR: Lime Android template not found.")

          plugins = [
              "com.google.firebase.crashlytics",
              "com.google.gms.google-services",
          ]

          extensions = {".gradle", ".gradle.kts", ".kts", ".template"}

          for path in root.rglob("*"):
              if not path.is_file():
                  continue

              if not any(str(path).endswith(ext) for ext in extensions):
                  continue

              try:
                  text = path.read_text()
              except (UnicodeDecodeError, OSError):
                  continue

              original = text

              for plugin in plugins:
                  escaped = re.escape(plugin)

                  patterns = [
                      rf"(?m)^[ \t]*apply\s+plugin\s*:\s*['\"]{escaped}['\"][^\n]*\n?",
                      rf"(?m)^[ \t]*id\s*\(?\s*['\"]{escaped}['\"][^\n]*\n?",
                      rf"(?m)^[ \t]*apply\s*\(\s*plugin\s*=\s*['\"]{escaped}['\"][^\n]*\n?",
                  ]

                  for pattern in patterns:
                      text = re.sub(pattern, "", text)

              text = re.sub(
                  r"(?ms)^[ \t]*firebaseCrashlytics\s*\{.*?^[ \t]*\}[ \t]*\n?",
                  "",
                  text
              )

              if text != original:
                  path.write_text(text)
                  print("Modified:", path)

          print("Firebase configuration cleanup completed.")
          PY

          echo "=== Checking remaining Firebase plugin applications ==="

          if grep -RInE \
            'apply plugin:.*(crashlytics|google-services)|id[ (]+["'\'']com\.google\.(firebase\.crashlytics|gms\.google-services)' \
            .haxelib/lime/git/templates/android/template; then
            echo "ERROR: Firebase plugin application still found."
            exit 1
          else
            echo "No Firebase plugin applications found."
          fi

      - name: Compile
        run: haxelib run lime build ${{ inputs.buildArgs }}

      - name: Verify Android APK
        if: inputs.exportPath == 'android'
        run: |
          APK="./export/release/android/bin/app/build/outputs/apk/release/PSliceEngine-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found at expected location."
            find export/release/android -name "*.apk" -type f
            exit 1
          fi

          echo "APK generated successfully."
          ls -lh "$APK"

      - name: Make IPA
        if: inputs.name == 'iOS'
        run: |
          cd export/release/ios/build/Release-iphoneos
          mkdir Payload
          mv *.app Payload
          zip -r ${{ env.PROJECT_NAME }}.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@main
        with:
          name: ${{ inputs.artifactName }}
          path: ${{ inputs.artifactPath }}
          if-no-files-found: error
